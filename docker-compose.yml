# Simple Gateway —— 统一 AI 能力中转网关（OCR + LLM，可扩展）
#
# 使用：
#   docker compose up -d --build
#   浏览器打开 http://localhost:8020/admin/
#
# 数据（SQLite 与运行时密钥）持久化在命名卷 gateway-data，重建容器不丢配置。
# 如需 PostgreSQL：把 SG_DATABASE_URL 改成 postgresql+psycopg://user:pass@host:5432/db

name: simple-gateway

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: simple-gateway:latest
    container_name: simple-gateway
    restart: unless-stopped
    ports:
      - "8020:8000"
    environment:
      SG_APP_NAME: "Simple Gateway"
      SG_HOST: "0.0.0.0"
      SG_PORT: "8000"
      # 数据库：PostgreSQL（compose 内 postgres 服务，不暴露宿主机端口）
      SG_DATABASE_URL: "postgresql+psycopg://sg:sgpass@postgres:5432/sgateway"

      # 管理后台：默认开启登录。生产环境请改掉默认口令与 JWT 密钥。
      SG_ADMIN_AUTH_ENABLED: "true"
      SG_ADMIN_USERNAME: "admin"
      SG_ADMIN_PASSWORD: "${SG_ADMIN_PASSWORD:-admin123}"

      # 密钥文件固定落在数据卷 /app/data/.secrets.json（与数据库类型无关）。
      # 否则切到 PostgreSQL 后路径会退化，进程自生成新密钥导致无法解密既有凭证。
      SG_SECRETS_FILE: "/app/data/.secrets.json"
      # SG_JWT_SECRET: ""
      # SG_FERNET_KEY: ""

      SG_PROXY_TIMEOUT: "120"
    volumes:
      - gateway-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ---- 专属 PostgreSQL（仅 compose 内部网络可达，不暴露宿主机端口）----
  postgres:
    image: postgres:16-alpine
    container_name: simple-gateway-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sg
      POSTGRES_PASSWORD: sgpass
      POSTGRES_DB: sgateway
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sg -d sgateway || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  gateway-data:
  postgres-data:
